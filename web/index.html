<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Probridge Land Bot</title>
  <meta name="theme-color" content="#1f2a37">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon-64.png" alt="" width="28" height="28">
      <div>
        <div class="title">Land Bot</div>
        <div class="sub" id="where">Probridge</div>
      </div>
    </div>
    <div class="top-right">
      <span class="dot" id="ai-dot" title="AI server status"></span>
      <button class="link" id="signin-btn" hidden>Sign in</button>
      <button class="link" id="account-btn" hidden></button>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer class="composer">
    <div id="rec-bar" class="rec-bar" hidden>
      <span class="rec-dot"></span> Recording <span id="rec-time">0:00</span>
      <button class="link" id="rec-cancel">Cancel</button>
    </div>
    <textarea id="msg" rows="3"
      placeholder="Paste the mediator's message here, or record / attach a voice note…"></textarea>
    <div class="actions">
      <button class="icon" id="mic-btn" title="Record voice">🎤</button>
      <label class="icon" title="Attach voice note (WhatsApp .opus, .m4a, .mp3)">📎
        <input type="file" id="file-input" accept="audio/*,.opus,.ogg,.m4a,.mp3,.aac,.wav,.webm" hidden>
      </label>
      <button class="primary" id="send-btn">Read message</button>
    </div>
  </footer>

  <template id="preview-tpl">
    <div class="card preview">
      <div class="card-head">
        <strong>Check before saving</strong>
        <span class="muted small" data-ref="time"></span>
      </div>
      <div class="dup" data-ref="dup" hidden></div>
      <form data-ref="form" class="fields"></form>
      <details class="source">
        <summary>Original message</summary>
        <pre data-ref="source"></pre>
      </details>
      <div class="card-actions">
        <button type="button" class="ghost" data-ref="discard">Discard</button>
        <button type="button" class="primary" data-ref="save">Save to Excel</button>
      </div>
    </div>
  </template>

  <script src="vendor/msal-browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
